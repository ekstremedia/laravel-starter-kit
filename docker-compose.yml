services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_HOST_PORT:-80}:80"
      - "${VITE_HOST_PORT:-5173}:5173"
      - "${REVERB_HOST_PORT:-8080}:8080"
    volumes:
      # Full project bind-mount for live code editing.
      - .:/var/www/html
      # Named volumes shadow the bind-mount for vendor/ and node_modules/.
      # Docker populates them from the pre-built image on first creation, which
      # avoids slow bind-mount IO on Docker Desktop (macOS/Windows) and keeps
      # dependencies isolated from the host. Want them host-visible for IDE
      # indexing instead? Remove these two lines and run `make build`.
      - app-vendor:/var/www/html/vendor
      - app-node-modules:/var/www/html/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-starter}
      POSTGRES_USER: ${DB_USERNAME:-starter}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-starter}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_HOST_PORT:-8126}:8025"

  # Headless document converter. App POSTs office/PDF files and gets back a
  # PDF; we render the first page to an image via Imagick/Spatie.
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--log-level=error"

volumes:
  postgres-data:
  redis-data:
  app-vendor:
  app-node-modules:
