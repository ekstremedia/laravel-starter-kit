server {
    listen 80;
    server_name _ localhost;
    root /var/www/html/public;

    client_max_body_size 550M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # The (opt-in) PWA service worker is emitted under /build but must control
    # the whole origin, so allow it to claim root scope. Harmless when the PWA
    # is disabled — the file simply won't exist.
    location = /build/sw.js {
        add_header Service-Worker-Allowed "/";
        add_header Cache-Control "no-cache";
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        # The base image's fastcgi_params maps HTTP_HOST to $host, which strips
        # the client-supplied port. That makes Laravel reconstruct request URLs
        # as http://localhost (no :PORT), breaking signed-URL *validation* —
        # email verification links, signed share links, etc. all 403. Restore
        # the full Host header (with port) so the reconstructed URL matches the
        # one we signed. Poisoning of *generated* absolute URLs is separately
        # mitigated by URL::forceRootUrl(config('app.url')) in AppServiceProvider.
        fastcgi_param HTTP_HOST $http_host;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
